<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRICKIMONS — Coming Soon</title>
  <meta name="description" content="BRICKIMONS is coming soon.">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(35, 104, 190, 0.18),
          transparent 34%
        ),
        #050913;
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .page {
      width: min(720px, 100%);
      text-align: center;
      padding: 54px 28px;
      border: 1px solid rgba(100, 150, 210, 0.16);
      border-radius: 28px;
      background: rgba(10, 20, 35, 0.72);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.45),
        0 0 60px rgba(30, 100, 190, 0.08);
      backdrop-filter: blur(14px);
    }

    .logo {
      width: min(280px, 70vw);
      max-height: 150px;
      object-fit: contain;
      display: block;
      margin: 0 auto 36px;
      filter: drop-shadow(
        0 10px 28px rgba(35, 125, 235, 0.18)
      );
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 14px;
      border: 1px solid rgba(80, 145, 220, 0.25);
      border-radius: 999px;
      background: rgba(35, 100, 180, 0.1);
      color: #75adf2;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 76px);
      line-height: 0.98;
      letter-spacing: -0.045em;
    }

    p {
      max-width: 520px;
      margin: 22px auto 0;
      color: #94a3b8;
      font-size: clamp(16px, 2.5vw, 19px);
      line-height: 1.65;
    }

    .line {
      width: 72px;
      height: 3px;
      margin: 30px auto 0;
      border-radius: 999px;
      background: #3989df;
      box-shadow: 0 0 22px rgba(57, 137, 223, 0.55);
    }

    .footer {
      margin-top: 34px;
      color: #526276;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="page">

    <img
      class="logo"
      src="brickimonlogo.png"
      alt="BRICKIMONS"
    >

    <div class="eyebrow">BRICKIMONS</div>

    <h1>Coming Soon</h1>

    <p>
      The BrickPlanet item database is being built.
      Track items, values, owners, and sales — all in one place.
    </p>

    <div class="line"></div>

    <div class="footer">
      brickimons.xyz
    </div>

  </main>
</body>
</html>
