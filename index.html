<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRICKIMONS — BrickPlanet Item Database</title>
<meta name="description" content="Brickimons — BrickPlanet community item and economy tracker.">
<style>
:root{
  --bg:#070d18;--panel:#0d1626;--panel2:#101c30;--border:#1d2b42;
  --blue:#3d8cff;--blue2:#67a7ff;--text:#f4f7fb;--muted:#94a3b8;
  --shadow:0 14px 40px rgba(0,0,0,.25);--radius:14px;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,rgba(61,140,255,.08),transparent 35%),var(--bg);color:var(--text);font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}.container{width:min(1120px,calc(100% - 32px));margin:auto}
header{position:sticky;top:0;z-index:20;background:rgba(7,13,24,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.nav{height:68px;display:flex;align-items:center;gap:28px}.brand img{display:block;width:128px;height:auto;max-height:42px;object-fit:contain}
.links{display:flex;gap:6px;align-items:center}.links a{padding:8px 11px;border-radius:9px;color:var(--muted);transition:.2s}.links a:hover,.links a.active{background:#101d31;color:#fff}
.nav-search{margin-left:auto;width:210px}.search-input{width:100%;background:#0c1524;border:1px solid var(--border);border-radius:10px;color:#fff;padding:10px 12px;outline:0}.search-input:focus{border-color:#356fbf;box-shadow:0 0 0 3px rgba(61,140,255,.1)}
.menu{display:none;margin-left:auto;background:none;border:1px solid var(--border);color:#fff;border-radius:9px;padding:8px 10px}
.hero{padding:88px 0 58px;text-align:center}.eyebrow{display:inline-block;color:var(--blue2);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;margin-bottom:14px}
h1{font-size:clamp(38px,6vw,64px);line-height:1.04;margin:0 0 18px;letter-spacing:-.04em}.hero p{max-width:680px;margin:0 auto;color:var(--muted);font-size:18px}
.hero-search{max-width:720px;margin:30px auto 16px;display:flex}.hero-search input{flex:1;font-size:16px;padding:16px 18px;border-radius:13px 0 0 13px}.hero-search button{border:0;background:var(--blue);color:#fff;padding:0 22px;border-radius:0 13px 13px 0;font-weight:700;cursor:pointer}
.quick{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:#0d1728;color:#dbe7f7;padding:9px 13px;border-radius:10px;transition:.2s;cursor:pointer}.btn:hover{border-color:#315b8f;transform:translateY(-1px)}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}
section{padding:28px 0 50px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}.section-head h2{margin:0;font-size:25px}.section-head p{margin:4px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(180deg,rgba(16,28,48,.9),rgba(12,21,36,.9));border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.stat{padding:20px}.stat small,.muted{color:var(--muted)}.stat strong{display:block;font-size:30px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.item-card{overflow:hidden;transition:.2s}.item-card:hover{transform:translateY(-3px);border-color:#31527c}.item-img{aspect-ratio:1.15;background:#0a1220;display:grid;place-items:center;border-bottom:1px solid var(--border)}.item-img img{width:75%;height:75%;object-fit:contain}.placeholder{color:#42536b;font-weight:700}.item-body{padding:15px}.item-body h3{margin:0 0 10px;font-size:16px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.meta span{display:block;color:var(--muted);font-size:12px}.meta b{font-size:13px}
.page{padding:50px 0}.page-title{margin-bottom:24px}.page-title h1{font-size:40px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.toolbar input,.toolbar select{background:#0c1524;border:1px solid var(--border);color:#fff;padding:11px 12px;border-radius:10px;outline:0}.toolbar input{min-width:240px}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter.active{background:#16345b;border-color:#315f99;color:#fff}
.detail{display:grid;grid-template-columns:360px 1fr;gap:26px;align-items:start}.detail-image{padding:28px;aspect-ratio:1;background:#0a1220;display:grid;place-items:center}.detail-image img{width:85%;height:85%;object-fit:contain}.detail-main h1{font-size:42px;margin-bottom:8px}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.stat-mini{padding:14px}.stat-mini span{display:block;color:var(--muted);font-size:12px}.stat-mini b{display:block;margin-top:3px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--border);white-space:nowrap}.table th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.empty{padding:34px;text-align:center;color:var(--muted)}.owner-list{display:grid;gap:8px}.owner{display:flex;justify-content:space-between;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:#0b1423}
footer{margin-top:50px;border-top:1px solid var(--border);padding:32px 0;color:var(--muted)}.footer{display:flex;justify-content:space-between;gap:25px;align-items:center}.footer-brand{display:flex;align-items:center;gap:12px}.footer-brand img{width:95px}.footer-links{display:flex;gap:14px;flex-wrap:wrap}.footer-links a:hover{color:#fff}
.search-results{position:absolute;top:58px;left:0;right:0;background:#0d1728;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:8px;display:none}.search-results.show{display:block}.search-wrap{position:relative}.result{padding:9px;border-radius:8px}.result:hover{background:#13233a}.result small{display:block;color:var(--muted)}
@media(max-width:850px){.links{display:none;position:absolute;top:68px;left:0;right:0;background:#080f1c;border-bottom:1px solid var(--border);padding:10px 16px;flex-direction:column;align-items:stretch}.links.open{display:flex}.nav-search{display:none}.menu{display:block}.stats,.grid{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}.detail-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.container{width:min(100% - 22px,1120px)}.hero{padding:60px 0 40px}.hero-search{display:block}.hero-search input,.hero-search button{width:100%;border-radius:11px}.hero-search button{margin-top:8px;padding:13px}.stats,.grid{grid-template-columns:1fr}.footer{align-items:flex-start;flex-direction:column}.page-title h1{font-size:34px}.detail-main h1{font-size:34px}.table thead{display:none}.table,.table tbody,.table tr,.table td{display:block;width:100%}.table tr{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;padding:8px}.table td{border:0;display:flex;justify-content:space-between;gap:20px;white-space:normal}.table td:before{content:attr(data-label);color:var(--muted);font-weight:600}}
</style>
</head>
<body>
<header>
<div class="container nav">
<a class="brand" href="#home"><img src="brickimonlogo.png" alt="BRICKIMONS"></a>
<nav class="links" id="links">
<a href="#home">Home</a><a href="#items">Items</a><a href="#players">Players</a><a href="#sales">Sales</a><a href="#about">About</a>
</nav>
<div class="nav-search search-wrap">
<input class="search-input" data-global-search placeholder="Search">
<div class="search-results"></div>
</div>
<button class="menu" id="menu">Menu</button>
</div>
</header>

<main id="app"></main>

<footer>
<div class="container footer">
<div class="footer-brand"><img src="brickimonlogo.png" alt="BRICKIMONS"><span>A BrickPlanet community project.</span></div>
<nav class="footer-links">
<a href="#home">Home</a><a href="#items">Items</a><a href="#players">Players</a><a href="#sales">Sales</a><a href="#about">About</a>
</nav><span>Brickimons</span>
</div>
</footer>

<script>
window.BRICKIMONS_CONFIG = {
  stats: { itemsTracked: 1, playersTracked: 1, salesRecorded: 1, limitedItems: ??? },
  links: { brickplanet: "https://www.brickplanet.com/" }
};
window.BRICKIMONS_ITEMS = [
  {
    id: "Template",
    name: "Template",
    image: "assets/items/azure-crown.png",
    value: null,
    owners: 9,
    created: 9,
    rarity: "Rare",
    description: "",
    serials: [],
    sales: []
  }
];
window.BRICKIMONS_PLAYERS = [
  {
    id: "brickimon",
    username: "Brickimon",
    netWorth: 0,
    groups: ["Rich People Of BrickPlanet"],
    items: []
  }
];
window.BRICKIMONS_SALES = [];

(() => {
  const cfg=window.BRICKIMONS_CONFIG||{stats:{}};
  const items=window.BRICKIMONS_ITEMS||[];
  const players=window.BRICKIMONS_PLAYERS||[];
  const sales=window.BRICKIMONS_SALES||[];
  const $=s=>document.querySelector(s);
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const value=v=>v===null||v===undefined||v===""?"N/A":v;
  const itemById=id=>items.find(x=>x.id===id);

  function itemCard(i){
    return `<a class="card item-card" href="#item/${encodeURIComponent(i.id)}">
      <div class="item-img">${i.image?`<img src="${esc(i.image)}" alt="${esc(i.name)}">`:`<span class="placeholder">NO IMAGE</span>`}</div>
      <div class="item-body"><h3>${esc(i.name)}</h3><div class="meta">
      <div><span>Value</span><b>${esc(value(i.value))}</b></div>
      <div><span>Owners</span><b>${esc(value(i.owners))}</b></div>
      <div><span>Created</span><b>${esc(value(i.created))}</b></div>
      <div><span>Rarity</span><b>${esc(value(i.rarity))}</b></div></div></div></a>`;
  }

  function saleRows(list){
    if(!list.length)return `<div class="empty">No recorded sales yet.</div>`;
    return `<div class="table-wrap"><table class="table"><thead><tr><th>Item</th><th>Seller</th><th>Buyer</th><th>Price</th><th>Serial</th><th>Date</th></tr></thead><tbody>
    ${list.map(s=>`<tr><td data-label="Item">${esc(itemById(s.itemId)?.name||s.item||"N/A")}</td><td data-label="Seller">${esc(s.seller||"N/A")}</td><td data-label="Buyer">${esc(s.buyer||"N/A")}</td><td data-label="Price">${esc(value(s.price))}</td><td data-label="Serial">${esc(value(s.serial))}</td><td data-label="Date">${esc(value(s.date))}</td></tr>`).join("")}</tbody></table></div>`;
  }

  function globalSearch(input,box){
    const q=input.value.trim().toLowerCase();box.innerHTML="";
    if(!q){box.classList.remove("show");return}
    const fi=items.filter(i=>i.name.toLowerCase().includes(q)).slice(0,5);
    const fp=players.filter(p=>p.username.toLowerCase().includes(q)).slice(0,5);
    if(!fi.length&&!fp.length)box.innerHTML='<div class="result muted">No results found.</div>';
    fi.forEach(i=>box.innerHTML+=`<a class="result" href="#item/${encodeURIComponent(i.id)}">${esc(i.name)}<small>Item</small></a>`);
    fp.forEach(p=>box.innerHTML+=`<a class="result" href="#player/${encodeURIComponent(p.id)}">${esc(p.username)}<small>Player</small></a>`);
    box.classList.add("show");
  }

  function layout(body){$("#app").innerHTML=body;}

  function home(){
    layout(`<section class="hero"><div class="container"><span class="eyebrow">BrickPlanet community project</span>
    <h1>The BrickPlanet Item Database</h1><p>Track BrickPlanet items, values, owners, and sales — all in one place.</p>
    <div class="hero-search search-wrap"><input class="search-input" data-global-search placeholder="Search items or players..."><button>Search</button><div class="search-results"></div></div>
    <div class="quick"><a class="btn primary" href="#items">Browse Items</a><a class="btn" href="#players">Players</a><a class="btn" href="#sales">Recent Sales</a></div></div></section>
    <section><div class="container"><div class="section-head"><h2>Site Statistics</h2></div><div class="stats">
    <div class="card stat"><small>Items Tracked</small><strong>${cfg.stats.itemsTracked??"N/A"}</strong></div>
    <div class="card stat"><small>Players Tracked</small><strong>${cfg.stats.playersTracked??"N/A"}</strong></div>
    <div class="card stat"><small>Sales Recorded</small><strong>${cfg.stats.salesRecorded??"N/A"}</strong></div>
    <div class="card stat"><small>Limited Items</small><strong>${cfg.stats.limitedItems??"N/A"}</strong></div></div></div></section>
    <section><div class="container"><div class="section-head"><div><h2>Featured Items</h2><p>Manually maintained item data.</p></div><a class="btn" href="#items">View all</a></div><div class="grid">${items.slice(0,4).map(itemCard).join("")||'<div class="empty">No data available.</div>'}</div></div></section>
    <section><div class="container"><div class="section-head"><div><h2>Recent Sales</h2><p>Only completed, manually recorded sales appear here.</p></div></div><div class="card">${saleRows(sales.slice().reverse().slice(0,8))}</div></div></section>`);
  }

  function itemsPage(){
    layout(`<main class="page"><div class="container"><div class="page-title"><span class="eyebrow">Database</span><h1>Item Database</h1><p class="muted">Browse manually maintained BrickPlanet items.</p></div>
    <div class="toolbar"><input id="item-search" placeholder="Search items..."><select id="item-sort"><option value="name">Name</option><option value="value">Value</option><option value="owners">Owners</option><option value="newest">Newest</option></select>
    <div class="filters"><button class="btn filter active" data-filter="all">All</button><button class="btn filter" data-filter="limited">Limited</button><button class="btn filter" data-filter="rare">Rare</button><button class="btn filter" data-filter="other">Other</button></div></div><div class="grid" id="items-list"></div></div></main>`);
    const list=$("#items-list"), search=$("#item-search"), sort=$("#item-sort"), filters=document.querySelectorAll("[data-filter]");
    function render(){const q=(search.value||"").toLowerCase(),f=document.querySelector(".filter.active")?.dataset.filter||"all";let a=items.filter(i=>(!q||i.name.toLowerCase().includes(q))&&(f==="all"||i.rarity?.toLowerCase()===f));
      if(sort.value==="name")a.sort((x,y)=>x.name.localeCompare(y.name));if(sort.value==="value")a.sort((x,y)=>(Number(y.value)||-1)-(Number(x.value)||-1));if(sort.value==="owners")a.sort((x,y)=>(Number(y.owners)||0)-(Number(x.owners)||0));if(sort.value==="newest")a.sort((x,y)=>(Number(y.created)||0)-(Number(x.created)||0));
      list.innerHTML=a.length?a.map(itemCard).join(""):'<div class="empty">No data available.</div>';}
    search.oninput=render;sort.onchange=render;filters.forEach(f=>f.onclick=()=>{filters.forEach(x=>x.classList.remove("active"));f.classList.add("active");render()});render();
  }

  function playersPage(){
    layout(`<main class="page"><div class="container"><div class="page-title"><span class="eyebrow">Community</span><h1>Players</h1><p class="muted">Search tracked BrickPlanet players.</p></div><div class="toolbar"><input id="player-search" placeholder="Search players..."></div><div class="grid" id="players-list"></div></div></main>`);
    const render=()=>{const q=($("#player-search").value||"").toLowerCase(),a=players.filter(p=>p.username.toLowerCase().includes(q));
      $("#players-list").innerHTML=a.length?a.map(p=>`<a class="card item-card" href="#player/${encodeURIComponent(p.id)}"><div class="item-body"><h3>${esc(p.username)}</h3><div class="meta"><div><span>Net Worth</span><b>${esc(value(p.netWorth))}</b></div><div><span>Items Owned</span><b>${p.items?.length||0}</b></div></div></div></a>`).join(""):'<div class="empty">No data available.</div>';};$("#player-search").oninput=render;render();
  }

  function salesPage(){
    layout(`<main class="page"><div class="container"><div class="page-title"><span class="eyebrow">Economy</span><h1>Recent Sales</h1><p class="muted">Only manually entered and verified completed sales are shown.</p></div><div class="toolbar"><input id="sales-search" placeholder="Search sales..."></div><div class="card" id="sales-list"></div></div></main>`);
    const render=()=>{const q=($("#sales-search").value||"").toLowerCase();$("#sales-list").innerHTML=saleRows(sales.filter(s=>JSON.stringify(s).toLowerCase().includes(q)))};$("#sales-search").oninput=render;render();
  }

  function itemPage(id){
    const i=itemById(id);if(!i){layout('<main class="page"><div class="container"><div class="empty card">Item not found.</div></div></main>');return}
    layout(`<main class="page"><div class="container"><div class="detail"><div class="card detail-image">${i.image?`<img src="${esc(i.image)}" alt="${esc(i.name)}">`:'<span class="placeholder">NO IMAGE</span>'}</div><div class="detail-main"><span class="eyebrow">${esc(value(i.rarity))}</span><h1>${esc(i.name)}</h1><div class="detail-grid">
    <div class="card stat-mini"><span>Estimated Value</span><b>${esc(value(i.value))}</b></div><div class="card stat-mini"><span>Owners</span><b>${esc(value(i.owners))}</b></div><div class="card stat-mini"><span>Created</span><b>${esc(value(i.created))}</b></div><div class="card stat-mini"><span>Rarity</span><b>${esc(value(i.rarity))}</b></div></div>
    <h2>Ownership</h2><div class="owner-list">${(i.serials||[]).length?i.serials.map(s=>`<div class="owner">#${esc(s.serial)} — ${esc(s.owner||"N/A")}</div>`).join(""):'<div class="empty card">No data available</div>'}</div>
    <h2>Sales History</h2>${saleRows(i.sales||[])}<h2>Description</h2><p class="muted">${i.description?esc(i.description):"No data available"}</p></div></div></div></main>`);
  }

  function playerPage(id){
    const p=players.find(x=>x.id===id);if(!p){layout('<main class="page"><div class="container"><div class="empty card">Player not found.</div></div></main>');return}
    const owned=(p.items||[]).map(o=>{const i=itemById(o.itemId);return i?itemCard(i):""}).join("");
    layout(`<main class="page"><div class="container"><div class="card" style="padding:26px"><span class="eyebrow">Player</span><h1 style="font-size:42px">${esc(p.username)}</h1><div class="detail-grid"><div class="card stat-mini"><span>Net Worth</span><b>${esc(value(p.netWorth))}</b></div><div class="card stat-mini"><span>Items</span><b>${p.items?.length||0}</b></div></div><h2>Groups</h2><p class="muted">${p.groups?.length?p.groups.map(esc).join(", "):"No data available"}</p></div><section><div class="section-head"><h2>Items</h2></div><div class="grid">${owned||'<div class="empty card">No data available</div>'}</div></section></div></main>`);
  }

  function aboutPage(){layout(`<main class="page"><div class="container"><div class="page-title"><span class="eyebrow">About</span><h1>About Brickimons</h1></div><div class="card" style="padding:28px;max-width:780px"><p>Brickimons is a community-made BrickPlanet item and economy tracker.</p><p>The goal is to make it easier for BrickPlanet players to look up items, ownership, sales, and other information about the BrickPlanet economy.</p><p><strong>Brickimons is not affiliated with or officially operated by BrickPlanet.</strong></p><p><a class="btn" href="https://www.brickplanet.com/">BrickPlanet</a></p></div></div></main>`)}

  function route(){
    const r=location.hash.slice(1)||"home", parts=r.split("/");
    if(parts[0]==="item")itemPage(decodeURIComponent(parts[1]||""));else if(parts[0]==="player")playerPage(decodeURIComponent(parts[1]||""));else if(r==="items")itemsPage();else if(r==="players")playersPage();else if(r==="sales")salesPage();else if(r==="about")aboutPage();else home();
    window.scrollTo(0,0);
    document.querySelectorAll(".links a").forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+(parts[0]||"home")));
    document.querySelectorAll("[data-global-search]").forEach(input=>{const box=input.parentElement.querySelector(".search-results");input.oninput=()=>globalSearch(input,box);});
  }

  $("#menu").onclick=()=>$("#links").classList.toggle("open");
  window.addEventListener("hashchange",route);
  route();
})();
</script>
</body>
</html>
